<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    

    <link rel="stylesheet" href="guess-words.css" />
    <title>Guess Words</title>
  </head>
  <body>
    <div class="bg-guess">
      <h1 class="tittle">
        <span>Guess the word</span>
      </h1>
      
     
    </div>
    <div class="whole-container">
     
       <div class="popup" ><p>🎉 YOU ACTUALLY WON!</p></div>
       <div class="wrongPopup"><p>❌ Wrong! Try a new word.</p></div>
      <div class="header"><h4>Word Scramble</h4></div>
      <div class="word-container"><p class="scrambled"></p></div>
      <div class="info-container">
        <div class="tries">
          <span class="triesNumber">Tries:(5/5)</span>
         <div id="game-rules">
           <button onclick="toggleInfo()"><i class="fa-solid fa-circle-info fa-sm"></i></button>
          <p id="rules" class="hide">
         Five Mistakes cost one try. Solve the word to win; a new word starts
            automatically. Random gives you a new word. Reset clears your
            answer and restores five tries.
          </p>
         </div>
         

          <!-- <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div> -->
        </div>
        <div class="mistakes"><p>Mistakes:</p></div>
      </div>
      <div class="inputs-box">
                <div class="filled-box"  >
      </div>
     
    </div>
     <div class="btns">
        <button class="randomBtn">Random</button>
        <button class="reset" onclick="resetGame()">Reset</button>
      </div>
      <script src="https://kit.fontawesome.com/b15e9369dd.js" crossorigin="anonymous"></script>
    <script src="guess-words.js"></script>
  </body>
</html>
